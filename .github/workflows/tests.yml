name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            port: 3306
          - database: pgsql
            port: 5432

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: onesolution_erp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psecret" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: onesolution_erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: onesolution_erp_test
      DB_USERNAME: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # The lock file needs PHP 8.4 (Symfony 8), like the servers and local dev.
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_pgsql, intl, sodium
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test --log-junit=junit.xml

      # Failed tests as annotations, readable on the run page without the log.
      - name: Report failed tests
        if: failure()
        run: php scripts/ci-annotate.php junit.xml

      # Phase 8-2: a real backup with the database's own dump tool, restored into a
      # separate database and checked (the same commands the servers schedule).
      - name: Backup and restore drill
        env:
          BACKUP_DRILL_DATABASE: onesolution_erp_restore_drill
        run: |
          if [ "${{ matrix.database }}" = "mysql" ]; then
            mysql -h 127.0.0.1 -u root -psecret -e "CREATE DATABASE IF NOT EXISTS onesolution_erp_restore_drill"
          else
            PGPASSWORD=secret createdb -h 127.0.0.1 -U postgres onesolution_erp_restore_drill
          fi
          php artisan migrate --force
          export BACKUP_KEY_V1="$(php artisan backup:run --generate-key | head -n 1)"
          php artisan backup:run
          php artisan backup:restore-drill

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Build and check the bundle budget
        run: npm run build
